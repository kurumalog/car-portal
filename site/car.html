<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車種ページ（試作版）</title>
<style>
  :root { --bg:#0B2644; --panel:#123358; --line:#2A4A73; --text:#EAF1FB; --sub:#9FB6D4; --accent:#F2994A; --warn:#E06666; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Hiragino Sans','Noto Sans JP',sans-serif; }
  header { padding: 20px; border-bottom:1px solid var(--line); }
  a.back { color: var(--sub); text-decoration:none; font-size:13px; }
  h1 { margin: 10px 0 2px; font-size: 24px; }
  .maker { color: var(--sub); font-size: 13px; }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .axes { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom: 24px; }
  .axis { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12px; color:var(--sub); text-align:center; }
  .axis .label { display:block; margin-bottom:4px; }
  .axis .status { color: var(--text); font-weight:600; }
  table { width:100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { color: var(--sub); font-weight:600; font-size:12px; }
  .note { color: var(--sub); font-size: 11px; max-width: 260px; }
  .needcheck { color: var(--warn); font-weight:600; }
  .axis .status small { display:block; color: var(--sub); font-weight:400; margin-top:2px; }

  /* リコール履歴 */
  #recallSection { margin-top: 36px; }
  #recallSection h2 { font-size: 18px; margin: 0 0 6px; }
  #recallSection h3 { font-size: 15px; margin: 22px 0 8px; }
  .lead { color: var(--sub); font-size: 12px; margin: 0 0 12px; line-height: 1.7; }
  .current { background: var(--panel); border:1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .gen-note { color: var(--sub); font-size: 12px; margin: 0 0 8px; }
  details.recall { background: var(--panel); border:1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  details.recall > summary { cursor: pointer; padding: 10px 14px; font-size: 13px; display:flex; flex-wrap:wrap; gap: 4px 14px; align-items: baseline; }
  details.recall > summary .date { color: var(--sub); font-variant-numeric: tabular-nums; }
  details.recall > summary .no { font-weight: 600; }
  details.recall > summary .kind { font-size: 11px; border:1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--sub); }
  details.recall > summary .kind.recall-k { color: var(--warn); border-color: var(--warn); }
  details.recall > summary .units { margin-left:auto; color: var(--sub); }
  details.recall > summary .also { font-size: 11px; color: var(--sub); border:1px dashed var(--line); border-radius: 4px; padding: 0 6px; }
  .dev-note { color: var(--sub); font-size: 11px; }
  .gen-src { color: var(--sub); font-size: 11px; }
  .gen-src a { color: var(--sub); }
  .recall-body { padding: 0 14px 12px; font-size: 13px; line-height: 1.7; }
  .branch + .branch { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .branch h4 { margin: 6px 0 4px; font-size: 12px; color: var(--sub); font-weight: 600; }
  .recall-body dl { display:grid; grid-template-columns: 6em 1fr; gap: 4px 10px; margin: 0; }
  .recall-body dt { color: var(--sub); font-size: 12px; }
  .recall-body dd { margin: 0; }
  .recall-body a { color: var(--accent); }
  .special { color: var(--sub); font-size: 11px; }
  .toggle-special { background: none; border:1px solid var(--line); color: var(--sub); border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; margin-top: 8px; }
  .credit { color: var(--sub); font-size: 11px; margin-top: 18px; line-height: 1.7; }
  .credit a { color: var(--sub); }
  @media (max-width: 700px) {
    .recall-body dl { grid-template-columns: 1fr; }
    .recall-body dt { margin-top: 4px; }
    .axes { grid-template-columns: repeat(2,1fr); }
    table, thead, tbody, th, td, tr { display:block; }
    thead { display:none; }
    tr { border-bottom:1px solid var(--line); padding:10px 0; }
    td { border:none; padding:3px 0; }
    td::before { content: attr(data-label) "： "; color: var(--sub); }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← 一覧へ戻る</a>
  <div class="maker" id="maker">-</div>
  <h1 id="model">読み込み中...</h1>
</header>
<main>
  <div class="axes">
    <div class="axis"><span class="label">リコール履歴</span><span class="status" id="recallStatus">未実装</span></div>
    <div class="axis"><span class="label">安全性能評価(JNCAP)</span><span class="status">未実装</span></div>
    <div class="axis"><span class="label">維持費試算</span><span class="status">未実装</span></div>
    <div class="axis"><span class="label">中古相場</span><span class="status">未実装</span></div>
  </div>
  <table id="gradeTable">
    <thead>
      <tr>
        <th>グレード</th><th>型式</th><th>駆動</th><th>エンジン</th><th>排気量</th><th>出力</th><th>価格(税込)</th><th>燃費WLTC</th><th>備考</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <section id="recallSection" hidden></section>
</main>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug');

fetch('data/cars.json').then(r => r.json()).then(d => {
  const m = d.models.find(x => x.slug === slug);
  if (!m) {
    document.getElementById('model').textContent = '車種が見つかりません';
    return;
  }
  document.getElementById('maker').textContent = m.maker;
  document.getElementById('model').textContent = m.model;
  document.title = `${m.model}｜${m.maker}｜自動車なんでも相談所`;

  const tbody = document.getElementById('tbody');
  for (const g of m.grades) {
    const tr = document.createElement('tr');
    const typeCls = g.typeCode === '要確認' ? 'needcheck' : '';
    tr.innerHTML = `
      <td data-label="グレード">${esc(g.grade)}</td>
      <td data-label="型式" class="${typeCls}">${esc(g.typeCode)}</td>
      <td data-label="駆動">${esc(g.drive)}</td>
      <td data-label="エンジン">${esc(g.engine)}</td>
      <td data-label="排気量">${esc(g.displacementCc)}cc</td>
      <td data-label="出力">${esc(g.powerPs)}ps</td>
      <td data-label="価格">${formatYen(g.priceYen)}</td>
      <td data-label="燃費">${esc(g.fuelEconomyWltc)}km/L</td>
      <td data-label="備考" class="note">${esc(g.note)}</td>
    `;
    tbody.appendChild(tr);
  }

  loadRecalls(m.slug);
});

// ===== リコール履歴 =====
// site/data/recalls/<slug>.json があれば表示する（無い車種は「未実装」のまま）
function loadRecalls(slug) {
  fetch('data/recalls/' + encodeURIComponent(slug) + '.json')
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d) renderRecalls(d); })
    .catch(() => {});
}

// データの形（data/recalls/<slug>.json）
//   generations: 新しい順の世代一覧。current: true が現行型
//   recalls[].generations: その届出が対象にする世代のid
//   recalls[].targets[].generation: 型式ごとの世代id
function renderRecalls(d) {
  const gens = d.generations;
  const cur = gens.find(g => g.current) || gens[0];
  const genName = id => (gens.find(g => g.id === id) || {}).name || id;
  const shortName = id => genName(id).split('（')[0];
  // 届出（枝番をまとめたもの）が対象にする世代のうち、いちばん新しい世代
  const genIdx = id => gens.findIndex(g => g.id === id);
  const groupGens = grp => [...new Set(grp.flatMap(r => r.generations))].sort((a, b) => genIdx(a) - genIdx(b));

  const normalGroups = groupByBase(d.recalls.filter(r => !r.specialVehicle));
  const specialGroups = groupByBase(d.recalls.filter(r => r.specialVehicle));
  const currentGroups = normalGroups.filter(grp => groupGens(grp).includes(cur.id));
  const oldCount = normalGroups.length - currentGroups.length;
  const ctx = { gens, shortName, groupGens, multi: gens.length > 1 };

  document.getElementById('recallStatus').innerHTML =
    gens.length > 1 ? `現行型 ${currentGroups.length}件<small>旧型 ${oldCount}件</small>` : `${currentGroups.length}件`;

  let html = `
    <h2>リコール履歴</h2>
    <p class="lead">国土交通省に届け出られたリコール・改善対策の情報です（${esc(d.coveredUntil)}までの届出、${esc(d.retrievedAt)}取得）。
    同じ車名でも、世代（モデルチェンジ前の型）が違えば対象になりません。「〜系」は型式の記号です。お持ちの車が対象かどうかは、車検証の型式・車台番号と照らし合わせるか、販売店でご確認ください。</p>
    ${d.note ? `<p class="gen-note">${esc(d.note)}</p>` : ''}
    <div class="current"><strong>現行型：${esc(cur.name)}</strong><br>
      ${currentGroups.length ? `${currentGroups.length}件の届出があります。` : esc(cur.note || '届出はありません。')}
      ${cur.officialSource ? `<br><span class="gen-src">世代の確認：<a href="${esc(cur.officialSource.url)}" target="_blank" rel="noopener">${esc(cur.officialSource.title)}</a></span>` : ''}</div>`;

  // 1つの届出は、対象の中でいちばん新しい世代の欄に1回だけ出す
  for (const g of gens) {
    const list = normalGroups.filter(grp => groupGens(grp)[0] === g.id);
    if (!list.length) continue;
    const title = g.id === cur.id ? `現行型：${g.name}` : `${g.name}（参考・旧型）`;
    html += `<h3>${esc(title)}：${list.length}件</h3>` + list.map(grp => renderGroup(grp, ctx)).join('');
  }

  if (specialGroups.length) {
    html += `<div id="specialBox" hidden>
      <h3>特装車向けの届出（参考）</h3>
      <p class="gen-note">警察車両・教習車など、後から装備を取り付けた特別な車両だけが対象の届出です。一般の${esc(d.model)}は対象外の可能性が高いです。</p>
      ${specialGroups.map(grp => renderGroup(grp, ctx)).join('')}
    </div>
    <button type="button" class="toggle-special" id="toggleSpecial">特装車向けの届出（${specialGroups.length}件）も表示</button>`;
  }

  html += `<p class="credit">${esc(d.source.credit)}<br>
    利用条件：${esc(d.source.license)}。届出内容を項目ごとに整理して掲載しています。
    <a href="${esc(d.source.url)}" target="_blank" rel="noopener">国土交通省ウェブサイト（新しいウインドウで開きます）</a></p>`;

  const sec = document.getElementById('recallSection');
  sec.innerHTML = html;
  sec.hidden = false;

  const btn = document.getElementById('toggleSpecial');
  if (btn) btn.addEventListener('click', () => {
    const box = document.getElementById('specialBox');
    box.hidden = !box.hidden;
    btn.textContent = box.hidden ? `特装車向けの届出（${specialGroups.length}件）も表示` : '特装車向けの届出を隠す';
  });
}

// 枝番（-1, -2 …）を同じ届出としてまとめる。新しい順
function groupByBase(list) {
  const map = new Map();
  for (const r of list) {
    if (!map.has(r.baseNo)) map.set(r.baseNo, []);
    map.get(r.baseNo).push(r);
  }
  return [...map.values()]
    .map(g => g.sort((a, b) => a.no.localeCompare(b.no)))
    .sort((a, b) => b[0].date.localeCompare(a[0].date));
}

// 届出1件分（クリックで詳細が開く）
function renderGroup(grp, ctx) {
  const head = grp[0];
  const devices = [...new Set(grp.map(r => r.device))].join('・');
  const units = grp.length === 1 ? head.units : `${grp.length}件に分けて届出`;
  const kindCls = head.kind === 'リコール' ? 'kind recall-k' : 'kind';
  // 複数の世代にまたがる届出は、ほかの世代も対象であることを示す
  const others = ctx.groupGens(grp).slice(1);
  const also = ctx.multi && others.length ? `<span class="also">${esc(others.map(ctx.shortName).join('・'))}も対象</span>` : '';
  const branches = grp.map(r => {
    const targets = r.targets.map(t =>
      `${esc(t.typeCode)}：${esc(t.chassisRange)}${ctx.multi ? `（${esc(ctx.shortName(t.generation))}）` : ''}`);
    return `<div class="branch">
      ${grp.length > 1 ? `<h4>${esc(r.no)}（${esc(r.device)}）</h4>` : ''}
      <dl>
        ${r.note ? `<dt>注記</dt><dd>${esc(r.note)}</dd>` : ''}
        <dt>状況</dt><dd>${esc(r.situation)}</dd>
        <dt>対策</dt><dd>${esc(r.measures)}</dd>
        <dt>対象台数</dt><dd>${esc(r.units)}（他車種を含む届出全体の台数）</dd>
        <dt>製作期間</dt><dd>${esc(r.productionPeriod)}</dd>
        <dt>対象の型式</dt><dd>${targets.join('<br>')}</dd>
        ${r.deviceOriginal ? `<dt>装置名</dt><dd class="dev-note">国土交通省のデータでは不具合装置名が「${esc(r.deviceOriginal)}」と途中で切れています。${r.device.endsWith('…)') ? '続きは不明です。' : `同じデータ内の表記「${esc(r.device)}」で補っています。`}</dd>` : ''}
        <dt>詳細</dt><dd><a href="${esc(r.url)}" target="_blank" rel="noopener">国土交通省の届出ページ（新しいウインドウ）</a></dd>
      </dl>
    </div>`;
  }).join('');

  return `<details class="recall">
    <summary>
      <span class="date">${esc(head.date.replace(/-/g, '/'))}</span>
      <span class="no">${esc(head.baseNo)}</span>
      <span class="${kindCls}">${esc(head.kind)}</span>
      <span>${esc(devices)}</span>
      ${also}
      <span class="units">${esc(units)}</span>
    </summary>
    <div class="recall-body">${branches}</div>
  </details>`;
}

function formatYen(v) {
  const n = Number(v);
  if (!v || isNaN(n)) return esc(v);
  return '¥' + n.toLocaleString('ja-JP');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
